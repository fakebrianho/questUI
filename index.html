<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quest UI Generator</title>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <header class="brand">
          <h1>Quest UI Generator</h1>
          <p>Edit, style, export as PNG overlays</p>
        </header>

        <section class="group">
          <label class="lbl">Layout</label>
          <div id="templatePicker" class="chips"></div>
        </section>

        <section class="group">
          <label class="lbl">Style</label>
          <div id="themePicker" class="swatches"></div>
        </section>

        <section class="group" id="rewardsGroup" hidden>
          <label class="lbl">Rewards</label>
          <label class="toggle">
            <input type="checkbox" id="showRewards" checked />
            Include in PNG
          </label>
        </section>

        <section class="group">
          <label class="lbl">Content</label>
          <div id="fields"></div>
        </section>

        <section class="group">
          <label class="lbl">Look</label>
          <div class="row">
            <span>Width</span>
            <input type="range" id="width" min="240" max="900" step="10" />
            <output id="widthOut"></output>
          </div>
          <div class="row">
            <span>Text size</span>
            <input type="range" id="fontScale" min="0.7" max="1.8" step="0.05" />
            <output id="fontScaleOut"></output>
          </div>
          <div class="row">
            <span>Accent</span>
            <input type="color" id="accent" />
            <button class="mini" id="accentReset" type="button">Reset</button>
          </div>
          <div class="row">
            <span>Opacity</span>
            <input type="range" id="opacity" min="0.4" max="1" step="0.05" />
            <output id="opacityOut"></output>
          </div>
        </section>

        <section class="group">
          <label class="lbl">Presets</label>
          <div class="btnrow">
            <button type="button" id="savePreset">Save preset</button>
            <label class="filebtn">Load preset<input type="file" id="loadPreset" accept=".json,application/json" hidden /></label>
            <button type="button" id="resetTemplate" class="ghost">Reset layout</button>
          </div>
        </section>
      </aside>

      <main class="stage-wrap">
        <div class="toolbar">
          <div class="seg" id="bgPicker">
            <button type="button" data-bg="checker">Transparent</button>
            <button type="button" data-bg="dark">Dark</button>
            <button type="button" data-bg="light">Light</button>
            <button type="button" data-bg="green">Green screen</button>
            <button type="button" data-bg="footage">Sample video</button>
          </div>
          <div class="export">
            <select id="exportScale" title="Export resolution">
              <option value="1">1x</option>
              <option value="2" selected>2x</option>
              <option value="3">3x</option>
              <option value="4">4x</option>
            </select>
            <select id="exportBg" title="Export background">
              <option value="transparent">Transparent PNG</option>
              <option value="#00b140">Green screen</option>
              <option value="#000000">Black</option>
            </select>
            <button type="button" id="copyBtn" class="ghost">Copy</button>
            <button type="button" id="exportBtn" class="primary">Download PNG</button>
          </div>
        </div>
        <div id="stage" class="stage bg-checker">
          <div id="frame" class="export-frame"></div>
        </div>
        <p id="toast" class="toast" role="status" aria-live="polite"></p>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
